# Real WordPress on localhost for the option-2 proof of concept.
# Started by wp_local.py (which also installs WP and injects the page);
# you can also drive it by hand:  docker compose -f wp/docker-compose.yml up -d
name: blissful-wp
services:
  db:
    image: mariadb:11
    container_name: blissful-wp-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootbread
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
  wordpress:
    image: wordpress:php8.3-apache
    container_name: blissful-wp
    restart: unless-stopped
    ports:
      - "8765:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    depends_on:
      db:
        condition: service_healthy
